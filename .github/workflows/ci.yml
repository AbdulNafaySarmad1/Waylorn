name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ot-core:
    name: Rust OT gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path crates/ot-core/Cargo.toml --locked

  gateway:
    name: Go site gateway
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/network-plane/waylorn-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/network-plane/waylorn-gateway/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  control-plane:
    name: .NET control plane
    runs-on: ubuntu-24.04
    # Disposable database for the migration and concurrent audit-chain tests (PostgresTests).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waylorn
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: waylorn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waylorn -d waylorn_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Waylorn.slnx
        env:
          WAYLORN_TEST_POSTGRES: Host=localhost;Database=waylorn_test;Username=waylorn;Password=ci-only

  frontend:
    name: Frontend (contracts, lint, types, unit, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile must match)
        run: pnpm install --frozen-lockfile
      - name: Generated contract types are up to date
        run: pnpm --filter @waylorn/contracts check:generated
      - name: Dependency audit (fail on high or critical)
        run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @waylorn/web build
      - name: Bundle mobile (Metro, Android)
        run: pnpm --filter @waylorn/mobile exec expo export --platform android --output-dir /tmp/mobile-export

  e2e:
    name: E2E, accessibility, degraded connectivity, performance
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waylorn/web exec playwright install --with-deps chromium
      - run: pnpm --filter @waylorn/web build
      - name: Playwright
        # Visual baselines are platform-specific; they run where they were generated (see docs/frontend/testing.md).
        run: pnpm --filter @waylorn/web exec playwright test --grep-invert "visual regression"
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
